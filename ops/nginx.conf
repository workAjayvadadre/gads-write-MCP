# Nginx site for adswrite.indiraivf.in
#
# Install:
#   sudo cp ops/nginx.conf /etc/nginx/sites-available/adswrite.indiraivf.in
#   sudo ln -s /etc/nginx/sites-available/adswrite.indiraivf.in /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d adswrite.indiraivf.in     # fills in the TLS block
#   sudo nginx -t && sudo systemctl reload nginx
#
# The MCP endpoint is streamable HTTP: long-lived responses delivered as
# server-sent events. Nginx defaults are wrong for that in two ways —
# it buffers the response, and it times out at 60s. Both are fixed below.

server {
    listen 80;
    server_name adswrite.indiraivf.in;
    # certbot replaces this with a redirect to 443 and adds the TLS block.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name adswrite.indiraivf.in;

    # ssl_certificate / ssl_certificate_key are written here by certbot.

    # This server can change ad spend. Keep it out of search indexes.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Ads API payloads are small; a low cap limits the blast radius of a
    # malformed or hostile request.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8081;   # must match GADS_PORT

        # --- streaming correctness ---------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Connection "";     # keepalive to upstream
        proxy_buffering off;                # do not hold SSE chunks
        proxy_cache off;
        chunked_transfer_encoding on;

        # A tool call that waits on the Google Ads API can outlast the 60s
        # default and would otherwise be cut off mid-response.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # --- what the app sees -------------------------------------------
        # FastMCP builds OAuth redirect URLs from GADS_BASE_URL, but these
        # headers must still be correct or the callback lands on http://
        # and Google rejects it.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
