# BREAK-GLASS TIER OVERRIDES. Normally this file does not exist.
#
# Tiers come from Google Ads. Add someone in the Google Ads UI and they work
# here, within the cache window, with no developer and nothing to edit:
#
#   Admin      -> lead       everything
#   Standard   -> operator   reports, pause/enable, negatives, budgets
#   Read only  -> readonly   reports
#   Email only -> none
#
# This file exists for ONE situation: Google cannot tell us someone's role -
# an outage, or a permission model that does not work the way we expect - and
# the team is locked out with no way back in but a developer redeploy.
#
# An entry here says: "Google could not tell us this person's role, and a lead
# has deliberately overridden it." It short-circuits Google entirely, applies
# on the next request with no restart, and logs a warning every time it is
# used.
#
# It is NOT a privilege escalation, which is worth knowing before worrying
# about a stale entry. Every Google Ads call still uses that person's own
# OAuth token, so if Google has removed them, Google refuses the read or write
# whatever tier we assign here. An override changes which tools appear in
# their menu and which tier lands in the audit line; it cannot grant access to
# an account Google will not let them touch.
#
# Why this is a file and not an env var: it is a list of privilege grants, and
# .env is gitignored. Here it has a history, shows up in review, and a
# forgotten entry is visible. Delete the entry - or the whole file - once
# Google is answering again.
#
# For local development without Google credentials, put yourself here. That is
# the same path a real break-glass takes, so it stays exercised.

users: {}
  # "someone@indiraivf.com": lead
