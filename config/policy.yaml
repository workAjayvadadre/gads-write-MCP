# Spending policy. Edit this file and save; the running server picks it up
# within seconds. No restart, no deploy, no developer.
#
# If an edit makes this file invalid, the server KEEPS THE LAST GOOD VERSION
# and logs the error. It will not fall back to permissive defaults, and it
# will not crash mid-request. Check `pm2 logs gads-write-mcp` after editing.

# Bumped when the structure changes, so a half-written file cannot parse as
# a valid-but-empty policy.
version: 2

# ---------------------------------------------------------------------
# Which accounts this server may touch at all.
# There is no wildcard. An account not listed here cannot be read or
# written, regardless of what the caller's Google permissions allow.
# Digits only, no dashes.
# ---------------------------------------------------------------------
allowed_customer_ids:
  - "0000000000"   # PLACEHOLDER: replace with the real test account before
                   # GADS_WRITE_ENABLED is ever set to true. Nothing can be
                   # read or written until this is a real ID.

currency_code: "INR"

# Timezone used to decide when "today" rolls over for the per-user daily
# spend ceiling. Should match the timezone configured on the Ads accounts,
# otherwise the cap resets at the wrong hour.
timezone: "Asia/Kolkata"

# ---------------------------------------------------------------------
# Limits. All amounts are in whole currency units (rupees), NOT micros.
#
# The rule these encode: NOTHING GOES ABOVE 50, NOTHING BELOW 10.
# That absolute band is the real safety mechanism. It binds regardless of
# tier, regardless of percentages, and regardless of how many changes
# somebody makes.
#
# `defaults` applies to every tier. `tiers` overrides per tier, key by key:
# an override only replaces the keys it names, so anything not listed below
# inherits from `defaults`. That inheritance is why `defaults` is set to the
# widest values in the band rather than something arbitrary - an inherited
# value must still be inside the band.
#
# Boundaries are INCLUSIVE. max_daily: 50 means 50 is allowed and 50.01 is
# not.
# ---------------------------------------------------------------------
limits:
  defaults:
    budget:
      min_daily: 10
      max_daily: 50
      # "Never more than double in one change." At a 10-50 band a tighter
      # percentage stops being a safety feature and starts being an
      # obstacle: at 10% it takes ~17 approved changes to get from 10 to 50,
      # and people work around obstacles. The absolute ceiling does the real
      # work here; this exists to stop a fat-fingered 10x in a single step.
      max_increase_percent: 100
      max_total_increase_per_user_per_day: 50
    bids:
      max_cpc: 50
      max_increase_percent: 100

  tiers:
    readonly:
      # DOCUMENTATION ONLY. safety/policy.py forces `readonly` and `none` to
      # zero in code, whatever this file says, so deleting this block changes
      # nothing. It is written out so the intent is visible where the other
      # tiers are.
      budget:
        max_daily: 0
        max_increase_percent: 0
        max_total_increase_per_user_per_day: 0
      bids:
        max_cpc: 0
        max_increase_percent: 0

    operator:
      budget:
        # min_daily inherits 10 from defaults.
        max_daily: 20
        max_increase_percent: 100
        # An operator may add at most 20 rupees of daily budget across ALL
        # campaigns in one day. With max_daily also 20, that is one
        # full-size increase per day.
        max_total_increase_per_user_per_day: 20
      bids:
        max_cpc: 20
        max_increase_percent: 100

    lead:
      budget:
        # min_daily inherits 10 from defaults.
        max_daily: 50
        max_increase_percent: 100
        max_total_increase_per_user_per_day: 50
      bids:
        max_cpc: 50
        max_increase_percent: 100

# ---------------------------------------------------------------------
# Structural rules.
# ---------------------------------------------------------------------
rules:
  # Anything this server creates (keywords, ads, ad groups) starts PAUSED.
  # A human enables it. This makes every creation reversible by default.
  new_entities_start_paused: true

  # Broad match under manual CPC is the classic way to burn money fast.
  block_broad_match_with_manual_cpc: true

  # Final URLs must be https and on one of these hosts. Exact host match,
  # so list the www variant separately if you use it.
  allowed_final_url_domains:
    - "indiraivf.com"
    - "www.indiraivf.com"

# ---------------------------------------------------------------------
# Operations refused outright, whatever the caller's tier.
# A second line of defence: these tools do not exist in v1, so this list
# should never fire. If it ever does, something regressed.
# ---------------------------------------------------------------------
blocked_operations:
  - "remove_campaign"
  - "remove_ad_group"
  - "remove_keyword"
  - "remove_budget"
  - "remove_conversion_action"
  - "remove_ad"

# ---------------------------------------------------------------------
# Draft plans.
# ---------------------------------------------------------------------
plans:
  ttl_seconds: 600      # 10 minutes
  single_use: true      # a plan_id can be confirmed exactly once
